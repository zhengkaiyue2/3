body{margin:0;background:radial-gradient(circle at 15% 0%,#eef9ef 0,#f3f5f2 42%,#e6eee8 100%);color:#183126;font-family:Segoe UI,Microsoft YaHei,sans-serif;padding:24px;min-height:100vh}main{max-width:560px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}h1{margin:0 0 5px;font-size:30px;letter-spacing:.02em;text-shadow:0 2px 12px #b5d4be66}header p,footer{color:#6b7b72;font-size:13px;letter-spacing:.01em}.badge{background:#e7f1e8;color:#376c50;padding:7px 12px;border-radius:999px;font-size:12px;letter-spacing:.04em;border:1px solid #d4e4d7}.stats{display:grid;grid-template-columns:repeat(3,1fr);background:#ffffffd9;border:1px solid #dce4dd;border-radius:16px;margin-bottom:12px;padding:14px 0;text-align:center;box-shadow:0 10px 28px #376c5012;backdrop-filter:blur(8px)}.stat+ .stat{border-left:1px solid #e5eae6}.label{display:block;font-size:12px;color:#69796f;margin-bottom:4px}.value{font-size:23px;font-weight:650;letter-spacing:.02em}#status{font-size:18px;color:#35734d}#status[data-state=lost]{color:#b0443b}.game{position:relative;padding:10px;border:1px solid #dce4dd;border-radius:18px;background:#ffffffd9;box-shadow:0 16px 36px #376c5018;backdrop-filter:blur(8px)}canvas{display:block;width:100%;aspect-ratio:1;border-radius:11px;box-shadow:inset 0 0 0 1px #ffffff80,0 8px 24px #18312622}.overlay{position:absolute;inset:10px;display:grid;place-items:center;text-align:center;background:#f5faf1e8;backdrop-filter:blur(5px);border-radius:8px}.overlay[hidden]{display:none}.overlay p{line-height:1.8;color:#627169;margin:8px 0 16px}button{cursor:pointer;padding:10px 18px;border-radius:10px;border:1px solid #31754e;background:linear-gradient(135deg,#3c8b5b,#286441);color:white;font-weight:600;box-shadow:0 5px 12px #28644133;transition:transform .15s,box-shadow .15s}button:hover{transform:translateY(-1px);box-shadow:0 8px 16px #28644144}button:active{transform:translateY(0)}.secondary{background:#fff;color:#355e46;border-color:#d3ded6}.toolbar{display:flex;justify-content:space-between;margin-top:12px;color:#627169;font-size:13px}.actions{display:flex;gap:8px}footer{border-top:1px solid #dce4dd;margin-top:18px;padding-top:12px;line-height:1.8}kbd{padding:2px 5px;border:1px solid #d3ded6;border-radius:4px;background:#fff}@media(max-width:420px){.badge{display:none}.toolbar{flex-direction:column;gap:10px}}

<body><main>
<header><div><h1>贪吃蛇</h1><p>五关挑战 · 每关 20 分</p></div><span class="badge">闯关版</span></header>
<div class="settings"><label for="difficulty">难度</label><select id="difficulty"><option value="easy" selected>简单</option><option value="normal">标准</option><option value="hard">困难</option></select></div>
<section class="stats" aria-label="游戏数据">
<div class="stat"><span class="label">总分</span><strong class="value" id="score">0</strong></div>
<div class="stat"><span class="label">当前关卡</span><strong class="value" id="level">1 / 5</strong></div>
<div class="stat"><span class="label">本关分数</span><strong class="value" id="level-score">0</strong></div>
<div class="stat"><span class="label" id="best-label">简单最高分</span><strong class="value" id="best">0</strong></div>
</section>
<section class="game" aria-label="游戏区域">
<canvas id="game" width="600" height="600" tabindex="0" aria-label="贪吃蛇棋盘，方向键或 WASD 移动，空格暂停">请使用支持 Canvas 的浏览器。</canvas>
<div class="overlay" id="overlay"><div><div class="victory-emblem" aria-hidden="true">★</div><h2 id="title">第 1 关</h2><p id="message">简单 · 20 分</p><button id="start">开始游戏</button></div></div>
<canvas id="celebration" width="600" height="600" aria-hidden="true" hidden></canvas>
<div id="stage-toast" role="status" hidden></div>
</section>
<div class="toolbar"><span>本关进度 <b id="progress">0 / 20</b></span><div class="actions"><button class="secondary" id="pause" disabled>暂停</button><button class="secondary" id="restart">重新开始</button></div></div>
<progress id="progress-bar" value="0" max="20" aria-label="本关进度"></progress>
<div class="status-row"><span id="status" role="status" aria-live="polite">未开始</span><span>步数 <b id="steps">0</b> · <span id="speed">210 ms / 格</span></span></div>
<div class="demo-controls"><button class="secondary" id="demo" aria-pressed="false">自动通关演示</button><div class="demo-options"><label for="demo-speed">演示速度</label><select id="demo-speed"><option value="1" selected>慢速</option><option value="2">标准</option><option value="4">快速</option></select></div></div>
<p class="storage-note" id="storage-note" hidden>浏览器存储不可用，最高分仅在本次打开期间保留。</p>
<div class="direction-pad" aria-label="方向控制">
<button class="secondary up" data-direction="ArrowUp" aria-label="向上" title="向上">↑</button>
<button class="secondary left" data-direction="ArrowLeft" aria-label="向左" title="向左">←</button>
<button class="secondary down" data-direction="ArrowDown" aria-label="向下" title="向下">↓</button>
<button class="secondary right" data-direction="ArrowRight" aria-label="向右" title="向右">→</button>
</div>
<footer class="key-hints" aria-label="按键提示">
<span><kbd>↑ ↓ ← →</kbd> / <kbd>W A S D</kbd> 移动</span>
<span><kbd>空格</kbd> 暂停 / 继续</span>
<span><kbd>Enter</kbd> 开始 / 继续 / 下一关</span>
</footer>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const canvas = $('game'), ctx = canvas.getContext('2d');
const gameArea = canvas.closest('.game');
const effectCanvas = $('celebration'), effectCtx = effectCanvas.getContext('2d');
const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
let effectFrame = null, effectTimer = null;
const SIZE = 20, CELL = 30, TARGET = 20, LEVELS = 5;
const MODES = {easy:{label:'简单',delay:210},normal:{label:'标准',delay:150},hard:{label:'困难',delay:110}};
const DIRECTIONS = {ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
const STORAGE_KEY = 'snake-levels-v1-best';
let records = {easy:0,normal:0,hard:0};
let mode = 'easy', state = 'ready', timer = null;
let snake, foods, dir, next, turnQueued = false;
let score = 0, levelScore = 0, level = 1, steps = 0;
let demo = false, canvasScale = 1;
// A Hamiltonian cycle visits every cell and keeps the snake in head-to-tail order.
const demoRoute = [];
for (let x = 0; x < SIZE; x++) demoRoute.push({x,y:0});
for (let y = 1; y < SIZE; y++) {
  for (let offset = 0; offset < SIZE - 1; offset++) {
    demoRoute.push({x:y % 2 ? SIZE - 1 - offset : offset + 1,y});
  }
}
for (let y = SIZE - 1; y > 0; y--) demoRoute.push({x:0,y});
const demoRouteIndex = new Map(demoRoute.map((p,i) => [p.y * SIZE + p.x,i]));

try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  for (const key of Object.keys(records)) {
    if (saved && Number.isInteger(saved[key]) && saved[key] >= 0 && saved[key] <= TARGET * LEVELS) records[key] = saved[key];
  }
} catch { $('storage-note').hidden = false; }

function saveBest() {
  if (demo || score <= records[mode]) return;
  records[mode] = score;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(records)); }
  catch { $('storage-note').hidden = false; }
}
function clearCelebration() {
  cancelAnimationFrame(effectFrame); clearTimeout(effectTimer);
  effectFrame = null; effectTimer = null;
  effectCtx.clearRect(0,0,600,600);
  effectCanvas.hidden = true;
  $('stage-toast').hidden = true;
  gameArea.classList.remove('celebrating');
}
function celebrate(completedLevel) {
  clearCelebration();
  const final = completedLevel === LEVELS;
  if (demo && !final) {
    $('stage-toast').textContent = '第 ' + completedLevel + ' 关完成';
    $('stage-toast').hidden = false;
  }
  // Restart the brief glow even when two demo levels finish close together.
  void gameArea.offsetWidth;
  gameArea.classList.add('celebrating');
  const duration = final ? 3400 : 1800;
  effectTimer = setTimeout(clearCelebration, duration);
  if (motionPreference.matches) return;
  const ratio = Math.min(window.devicePixelRatio || 1,2);
  effectCanvas.width = 600 * ratio; effectCanvas.height = 600 * ratio;
  effectCtx.setTransform(ratio,0,0,ratio,0,0);
  effectCanvas.hidden = false;
  const colors = ['#d5ac43','#31754e','#52a8a2','#e27b66','#f0d989'];
  const particles = Array.from({length:final ? 150 : 70}, (_,i) => {
    const left = i % 2 === 0;
    return {x:left ? 25 : 575,y:final ? 490 : 450,
      vx:(left ? 1 : -1)*(50+Math.random()*200),vy:-230-Math.random()*260,
      angle:Math.random()*Math.PI,spin:(Math.random()-.5)*9,
      size:4+Math.random()*6,color:colors[i%colors.length]};
  });
  const started = performance.now();
  function frame(now) {
    const elapsed = now - started, t = elapsed / 1000;
    effectCtx.clearRect(0,0,600,600);
    if (elapsed >= duration) { clearCelebration(); return; }
    effectCtx.globalAlpha = Math.min(1,(duration-elapsed)/700);
    for (const p of particles) {
      const px = p.x+p.vx*t, py = p.y+p.vy*t+140*t*t;
      // Keep victory text and the action button unobscured.
      if (! $('overlay').hidden && px > 150 && px < 450 && py > 130 && py < 440) continue;
      effectCtx.save(); effectCtx.translate(px,py); effectCtx.rotate(p.angle+p.spin*t);
      effectCtx.fillStyle = p.color;
      effectCtx.fillRect(-p.size/2,-p.size/4,p.size,p.size/2);
      effectCtx.restore();
    }
    effectCtx.globalAlpha = 1;
    effectFrame = requestAnimationFrame(frame);
  }
  effectFrame = requestAnimationFrame(frame);
}
motionPreference.addEventListener('change', () => { if (motionPreference.matches) clearCelebration(); });
function delay() { return Math.max(65, MODES[mode].delay - (level - 1) * 12); }
function stopClock() { clearInterval(timer); timer = null; }
function startClock() { stopClock(); timer = setInterval(demo ? demoFrame : tick, demo ? 150 : delay()); }
function demoFrame() {
  if (!demo || state !== 'playing') return;
  const count = Number($('demo-speed').value);
  for (let i = 0; i < count && state === 'playing'; i++) tick(false);
  draw(); ui();
}
function toggleDemo() {
  if (demo) { newRun(); canvas.focus({preventScroll:true}); return; }
  newRun(); demo = true;
  primaryAction();
}
function demoDirection() {
  const head = snake[0];
  const targets = new Set(foods.map(food => food.y * SIZE + food.x));
  const blocked = new Set(snake.slice(0,-1).map(part => part.y * SIZE + part.x));
  const queue = [{x:head.x,y:head.y,path:[]}];
  const visited = new Set([head.y * SIZE + head.x]);
  const moves = [[1,0],[-1,0],[0,1],[0,-1]];
  while (queue.length) {
    const current = queue.shift();
    const key = current.y * SIZE + current.x;
    if (targets.has(key) && current.path.length) return current.path[0];
    for (const [dx,dy] of moves) {
      const x = current.x + dx, y = current.y + dy, nextKey = y * SIZE + x;
      if (x < 0 || x >= SIZE || y < 0 || y >= SIZE || visited.has(nextKey) || blocked.has(nextKey)) continue;
      visited.add(nextKey);
      queue.push({x,y,path:current.path.concat([[dx,dy]])});
    }
  }
  const index = demoRouteIndex.get(head.y * SIZE + head.x);
  const destination = demoRoute[(index + 1) % demoRoute.length];
  return [destination.x - head.x,destination.y - head.y];
}
function ui() {
  $('score').textContent = score;
  $('level-score').textContent = levelScore;
  $('level').textContent = level + ' / ' + LEVELS;
  $('best').textContent = records[mode];
  $('best-label').textContent = MODES[mode].label + '最高分';
  $('steps').textContent = steps;
  $('progress').textContent = levelScore + ' / ' + TARGET;
  $('progress-bar').value = levelScore;
  $('speed').textContent = demo ? '演示 · 不计最高分' : delay() + ' ms / 格';
  $('status').textContent = {ready:'未开始',playing:'进行中',paused:'已暂停',cleared:'本关完成',won:'全部通关',lost:'游戏结束'}[state];
  if (demo) $('status').textContent = '演示 · 追踪最近食物 · ' + $('status').textContent;
  $('status').dataset.state = state;
  gameArea.dataset.state = state;
  $('pause').disabled = !['playing','paused'].includes(state);
  $('pause').textContent = state === 'paused' ? '继续' : '暂停';
  $('difficulty').disabled = demo || ['playing','paused','cleared'].includes(state);
  $('demo').textContent = demo ? '退出演示' : '自动通关演示';
  $('demo').setAttribute('aria-pressed', String(demo));
  document.querySelectorAll('[data-direction]').forEach(button => { button.disabled = demo; });
  $('overlay').hidden = state === 'playing';
}
function overlay(title, message, action) {
  $('title').textContent = title;
  $('message').textContent = message;
  $('start').textContent = action;
  ui();
}
function addFood() {
  const empty = [];
  for (let y = 0; y < SIZE; y++) for (let x = 0; x < SIZE; x++) {
    if (!snake.some(p => p.x === x && p.y === y) && !foods.some(p => p.x === x && p.y === y)) empty.push({x,y});
  }
  if (empty.length) foods.push(empty[Math.floor(Math.random() * empty.length)]);
}
function resetBoard() {
  snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir = [1,0]; next = [1,0]; turnQueued = false;
  levelScore = 0;
  foods = [];
  const count = 4;
  for (let i = 0; i < count; i++) addFood();
  draw();
}
function newRun() {
  stopClock();
  clearCelebration();
  demo = false;
  score = 0; steps = 0; level = 1;
  state = 'ready';
  resetBoard();
  overlay('第 1 关', MODES[mode].label + ' · ' + TARGET + ' 分', '开始游戏');
}
function primaryAction() {
  if (state === 'playing') return;
  if (state === 'paused') { togglePause(); return; }
  if (state === 'lost' || state === 'won') {
    const replayDemo = demo;
    newRun(); demo = replayDemo;
  }
  if (state === 'cleared') { clearCelebration(); level++; resetBoard(); }
  state = 'playing';
  ui(); startClock(); canvas.focus({preventScroll:true});
}
function lose(message) {
  stopClock(); state = 'lost';
  clearCelebration();
  overlay('游戏结束', message + ' 总分 ' + score + '，到达第 ' + level + ' 关。', '再玩一次');
}
function tick(render = true) {
  if (state !== 'playing') return;
  if (demo) {
    next = demoDirection();
  }
  dir = next; turnQueued = false;
  const head = {x:snake[0].x + dir[0],y:snake[0].y + dir[1]};
  const foodIndex = foods.findIndex(p => p.x === head.x && p.y === head.y);
  const eat = foodIndex !== -1;
  if (head.x < 0 || head.x >= SIZE || head.y < 0 || head.y >= SIZE) { lose('撞到墙壁了。'); return; }
  if ((eat ? snake : snake.slice(0,-1)).some(p => p.x === head.x && p.y === head.y)) { lose('撞到自己了。'); return; }
  snake.unshift(head); steps++;
  if (eat) {
    score++; levelScore++;
    foods.splice(foodIndex,1); addFood(); saveBest();
  } else snake.pop();
  if (render) draw();
  if (levelScore === TARGET) {
    if (demo && level < LEVELS) {
      const completedLevel = level;
      level++; resetBoard(); ui(); celebrate(completedLevel); return;
    }
    stopClock();
    state = level === LEVELS ? 'won' : 'cleared';
    overlay(state === 'won' ? (demo ? '自动演示完成！' : '五关挑战完成！') : '第 ' + level + ' 关完成',
      '总分 ' + score + ' · ' + steps + ' 步', state === 'won' ? (demo ? '再次演示' : '再玩一次') : '进入第 ' + (level + 1) + ' 关');
    celebrate(level);
  } else if (render) ui();
}
function togglePause() {
  if (state === 'playing') {
    stopClock(); state = 'paused';
    overlay('已暂停', '第 ' + level + ' 关 · 总分 ' + score, '继续游戏');
  } else if (state === 'paused') {
    state = 'playing'; ui(); startClock(); canvas.focus({preventScroll:true});
  }
}
function steer(direction) {
  if (demo) return;
  if (state === 'ready') primaryAction();
  if (state !== 'playing' || turnQueued) return;
  if (direction[0] * dir[0] + direction[1] * dir[1] === 0) {
    next = direction; turnQueued = true;
  }
}
function draw() {
  const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== 600 * pixelRatio) { canvas.width = canvas.height = 600 * pixelRatio; canvasScale = pixelRatio; }
  ctx.setTransform(canvasScale,0,0,canvasScale,0,0);
  const bg = ctx.createLinearGradient(0,0,600,600);
  bg.addColorStop(0,'#fbfff6'); bg.addColorStop(.45,'#eef7e9'); bg.addColorStop(1,'#dcebdc');
  ctx.fillStyle = bg; ctx.fillRect(0,0,600,600);
  const light = ctx.createRadialGradient(125,95,8,125,95,330); light.addColorStop(0,'#ffffff70'); light.addColorStop(1,'#ffffff00'); ctx.fillStyle = light; ctx.fillRect(0,0,600,600);
  ctx.strokeStyle = '#d4e4d2'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let i = 1; i < SIZE; i++) {
    ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,600);
    ctx.moveTo(0,i*CELL); ctx.lineTo(600,i*CELL);
  }
  ctx.stroke();
  foods.forEach(food => {
    const cx = (food.x+.5)*CELL, cy = (food.y+.5)*CELL;
    const glow = ctx.createRadialGradient(cx-3,cy-3,1,cx,cy,12);
    glow.addColorStop(0,'#ffd978'); glow.addColorStop(1,'#c97923');
    ctx.fillStyle = glow; ctx.shadowColor = '#db8a2c88'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(cx,cy,9,0,Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; ctx.fillStyle = '#fff4c4aa'; ctx.beginPath(); ctx.arc(cx-3,cy-3,2.5,0,Math.PI*2); ctx.fill();
  });
  snake.forEach((p,i) => {
    const g = ctx.createLinearGradient(p.x*CELL,p.y*CELL,(p.x+1)*CELL,(p.y+1)*CELL);
    g.addColorStop(0,i ? '#a8d18f' : '#4b9a67'); g.addColorStop(1,i ? '#5e9660' : '#1f5738');
    ctx.fillStyle = g; ctx.shadowColor = '#28644133'; ctx.shadowBlur = i ? 3 : 6;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(p.x*CELL+2,p.y*CELL+2,26,26,i ? 7 : 9);
    else ctx.rect(p.x*CELL+2,p.y*CELL+2,26,26);
    ctx.fill(); ctx.shadowBlur = 0;
  });
}
document.addEventListener('keydown', event => {
  if (event.target.closest('button,select,input,textarea')) return;
  const direction = DIRECTIONS[event.key] || DIRECTIONS[event.key.toLowerCase()];
  if (direction || event.key === ' ' || event.key === 'Enter') event.preventDefault();
  if (event.repeat && !direction) return;
  if (direction) steer(direction);
  else if (event.key === ' ') togglePause();
  else if (event.key === 'Enter') primaryAction();
});
$('start').onclick = primaryAction;
$('demo').onclick = toggleDemo;
$('pause').onclick = togglePause;
$('restart').onclick = () => { newRun(); canvas.focus({preventScroll:true}); };
$('difficulty').onchange = event => { mode = event.target.value; newRun(); };
document.querySelectorAll('[data-direction]').forEach(button => {
  button.onclick = () => { steer(DIRECTIONS[button.dataset.direction]); canvas.focus({preventScroll:true}); };
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') togglePause(); });
window.addEventListener('blur', () => { if (state === 'playing') togglePause(); });
newRun();
</script>
