<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<rect width="100%" height="100%" fill="white"/>
<text x="450" y="35" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">RC低通滤波电路</text>
<!-- wires -->
<line x1="90" y1="180" x2="170" y2="180" stroke="#111" stroke-width="3"/>
<line x1="270" y1="180" x2="420" y2="180" stroke="#111" stroke-width="3"/>
<line x1="420" y1="180" x2="690" y2="180" stroke="#111" stroke-width="3"/>
<line x1="90" y1="300" x2="690" y2="300" stroke="#111" stroke-width="3"/>
<!-- source -->
<circle cx="90" cy="240" r="40" fill="white" stroke="#111" stroke-width="3"/>
<path d="M65 240 C73 220 82 220 90 240 S107 260 115 240" fill="none" stroke="#06c" stroke-width="2.5"/>
<line x1="90" y1="180" x2="90" y2="200" stroke="#111" stroke-width="3"/><line x1="90" y1="280" x2="90" y2="300" stroke="#111" stroke-width="3"/>
<text x="90" y="345" text-anchor="middle" font-family="Arial" font-size="16">vi</text><text x="90" y="370" text-anchor="middle" font-family="Arial" font-size="13">1 V / 1 kHz</text>
<!-- resistor zigzag -->
<path d="M170 180 l12 -18 l20 36 l20 -36 l20 36 l20 -36 l8 18" fill="none" stroke="#111" stroke-width="3"/>
<text x="220" y="140" text-anchor="middle" font-family="Arial" font-size="16">R = 1 kΩ</text>
<!-- capacitor -->
<line x1="420" y1="180" x2="420" y2="225" stroke="#111" stroke-width="3"/>
<line x1="390" y1="225" x2="450" y2="225" stroke="#111" stroke-width="4"/>
<line x1="390" y1="245" x2="450" y2="245" stroke="#111" stroke-width="4"/>
<line x1="420" y1="245" x2="420" y2="300" stroke="#111" stroke-width="3"/>
<text x="475" y="240" font-family="Arial" font-size="16">C = 100 nF</text>
<!-- output and ground -->
<circle cx="420" cy="180" r="5" fill="#111"/>
<line x1="690" y1="180" x2="690" y2="205" stroke="#111" stroke-width="3"/>
<text x="705" y="185" font-family="Arial" font-size="16">vo</text>
<line x1="690" y1="300" x2="690" y2="320" stroke="#111" stroke-width="3"/>
<line x1="665" y1="320" x2="715" y2="320" stroke="#111" stroke-width="3"/><line x1="673" y1="330" x2="707" y2="330" stroke="#111" stroke-width="3"/><line x1="682" y1="340" x2="698" y2="340" stroke="#111" stroke-width="3"/>
<text x="700" y="365" font-family="Arial" font-size="14">GND</text>
<text x="450" y="395" text-anchor="middle" font-family="Arial" font-size="14">一阶 RC 低通滤波器，截止频率 fc ≈ 1.59 kHz</text>
</svg>